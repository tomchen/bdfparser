name: Release

# Publishing happens only for a published GitHub release whose tag is
# `v<bdfparser.__version__>` (no manual runs from arbitrary branches).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Check that the release tag matches bdfparser.__version__
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv run python -c 'import bdfparser; print(bdfparser.__version__)')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag '$TAG' does not match bdfparser.__version__ '$version' (expected 'v$version')"
            exit 1
          fi
      - name: Test
        run: uv run pytest -q
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bdfparser/
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
